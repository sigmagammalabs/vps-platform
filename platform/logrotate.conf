# ---------------------------------------------------------------------------
# Log-Rotation fuer Dateien, die sonst niemand rotiert. Installiert von
# bootstrap/host-setup.sh nach /etc/logrotate.d/platform (taeglich geprueft).
#
# NICHT hier eintragen:
#   - Container-Logs (stdout/stderr): rotiert Docker selbst (daemon.json, 3 x 10 MB)
#   - arbitrage-scout logs/scout.log: rotiert die App selbst (RotatingFileHandler)
#
# Neue App mit eigener Logdatei ohne Rotation: Block nach Vorbild unten ergaenzen.
# "su app app": die Verzeichnisse gehoeren dem App-Benutzer (UID 10001, auf dem
# Host von host-setup.sh als "app" angelegt) - logrotate rotiert dann als dieser.
# ---------------------------------------------------------------------------

/srv/apps/premarket-screener/watchlist/*.log {
    su app app
    weekly
    maxsize 20M
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}

/var/log/platform-backup.log {
    su root adm
    monthly
    rotate 6
    compress
    missingok
    notifempty
}
