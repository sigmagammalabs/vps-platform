# ---------------------------------------------------------------------------
# Tailscale Serve: welche lokale Weboberflaeche unter welchem HTTPS-Port im
# Tailnet erscheint. Angewendet von scripts/tailscale-serve.sh (auch automatisch
# bei scripts/platform.sh up).
#
#   <https-port>  <ziel>                              <name>
#
# Ziel "https+insecure://" = Backend spricht selbst HTTPS mit eigenem Zertifikat.
# Neue Oberflaeche: Dienst auf 127.0.0.1:<port> binden, hier eine Zeile ergaenzen.
# ---------------------------------------------------------------------------

443   http://127.0.0.1:3000                 Homepage
9443  https+insecure://127.0.0.1:9443       Portainer
8090  http://127.0.0.1:8090                 Beszel
8080  http://127.0.0.1:8080                 Dozzle
8081  http://127.0.0.1:8081                 Ofelia
