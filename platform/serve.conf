# ---------------------------------------------------------------------------
# Tailscale Serve: welche lokale Weboberflaeche unter welchem HTTPS-Port im
# Tailnet erscheint. Angewendet von scripts/tailscale-serve.sh (auch automatisch
# bei scripts/platform.sh up).
#
#   <https-port>  <ziel>                              <name>
#
# Ziel "https+insecure://" = Backend spricht selbst HTTPS mit eigenem Zertifikat.
# Neue Oberflaeche: Dienst auf 127.0.0.1:<port> binden, hier eine Zeile ergaenzen.
# ---------------------------------------------------------------------------

443   http://127.0.0.1:3000                 Homepage
9443  https+insecure://127.0.0.1:9443       Portainer
8090  http://127.0.0.1:8090                 Beszel
8080  http://127.0.0.1:8080                 Dozzle
8081  http://127.0.0.1:8081                 Ofelia
8100  http://127.0.0.1:8100                 AuthServer

# ---------------------------------------------------------------------------
# OEFFENTLICH (Tailscale Funnel): erreichbar ohne Tailscale, fuer jeden im Internet.
# Nur bewusst und nur fuer EINEN Pfad - der Rest des Dienstes bleibt im Tailnet.
#
#   funnel  <https-port: 443|8443|10000>  <pfad>  <ziel>  <name>
#
# Einmalig muss Funnel in der Tailscale-Adminkonsole fuer das Tailnet erlaubt sein
# (tailscale funnel zeigt dazu beim ersten Aufruf einen Link).
# Auth-Server: nur /api (Lizenzpruefung der Desktop-Tools); /admin bleibt im Tailnet.
# Erst aktivieren, wenn stacks/auth-server getestet ist (siehe dessen README).
#
funnel  10000  /api  http://127.0.0.1:8100/api  AuthServer-API
